
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid Glass Interface</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --glass-border: rgba(255, 255, 255, .16);
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, #292640 0, transparent 42%),
        radial-gradient(ellipse at 95% 45%, #1c3037 0, transparent 40%),
        #09090c;
    }

    /* Liquid-glass header */

    .glass-header {
      position: sticky;
      top: 12px;
      z-index: 1000;
      width: min(1100px, calc(100% - 28px));
      margin: 12px auto 0;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      background: rgba(24, 24, 29, .68);
      border: 1px solid var(--glass-border);
      border-radius: 24px;

      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, .25),
        inset 0 1px rgba(255, 255, 255, .12);
    }

    .brand {
      color: white;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.5px;
      text-decoration: none;
      white-space: nowrap;
    }

    .brand span {
      color: #a5b4fc;
    }

    /* Navigation */

    .nav-glass {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border-radius: 17px;
      background: rgba(0, 0, 0, .22);
    }

    .nav-glass .nav-link {
      position: relative;
      color: #b8b8c2;
      padding: 10px 16px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;

      transition:
        color .3s var(--ease),
        background .3s var(--ease),
        transform .3s var(--ease);
    }

    .nav-glass .nav-link:hover {
      color: white;
      background: rgba(255, 255, 255, .07);
    }

    .nav-glass .nav-link:active {
      transform: scale(.95);
    }

    .nav-glass .nav-link.active {
      color: white;
      background: rgba(255, 255, 255, .15);
      box-shadow:
        inset 0 1px rgba(255, 255, 255, .13),
        0 2px 8px rgba(0, 0, 0, .12);
    }

    /* Page switching: only the active page is visible */

    .page-section {
      display: none;
    }

    .page-section.active {
      display: block;
      animation: pageEnter .65s var(--ease) both;
    }

    @keyframes pageEnter {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(.985);
        filter: blur(10px);
      }

      65% {
        filter: blur(1px);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    /* Mobile navigation */

    @media (max-width: 600px) {
      .glass-header {
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        padding: 10px;
      }

      .brand {
        display: none;
      }

      .nav-glass {
        width: 100%;
        justify-content: space-between;
      }

      .nav-glass .nav-link {
        flex: 1;
        padding: 10px 7px;
        text-align: center;
        font-size: 12px;
      }
    }

    /* Accessibility */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>

<body>

  <!-- Header: customize the buttons as needed -->

  <header class="glass-header">

    <a href="#" class="brand" id="brandHome">
      LIQUID<span>.</span>
    </a>

    <nav class="nav nav-glass" id="mainNav" aria-label="Main navigation">

      <button
        class="nav-link active"
        type="button"
        data-page="section1"
        aria-current="page">
        Viscosity
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section2">
        Denisty
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section3">
       Physical states
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section4">
        Bouncing ball
      </button>

    </nav>
  </header>

  <!--
    YOUR SECTIONS GO HERE.

    Give each section the class "page-section".
    The first section should also have the class "active".
    Each section's ID must match a navigation button's data-page.
  -->

  <main id="pageContainer">

    <section id="section1" class="page-section active">
      <iframe src="nine.html"></iframe>
    </section>

    <section id="section2" class="page-section">
      <iframe src="ten.html"></iframe>
    </section>

    <section id="section3" class="page-section">
      <iframe src="eleven.html"></iframe>
    </section>

    <section id="section4" class="page-section">
      <iframe src="twelve.html"></iframe>
    </section>

  </main>

  <script>
    /* Single-page navigation */

    const navButtons = document.querySelectorAll(
      "#mainNav [data-page]"
    );

    const pages = document.querySelectorAll(
      "#pageContainer .page-section"
    );

    let currentPage = "section1";

    function showPage(pageId) {
      const targetPage = document.getElementById(pageId);

      // Only allow navigation to registered pages.
      if (!targetPage || !targetPage.classList.contains("page-section")) {
        return;
      }

      if (currentPage === pageId) {
        return;
      }

      currentPage = pageId;

      // Hide all sections.
      pages.forEach(page => {
        page.classList.remove("active");
      });

      // Reveal only the selected section.
      targetPage.classList.add("active");

      // Update the selected header button.
      navButtons.forEach(button => {
        const selected = button.dataset.page === pageId;

        button.classList.toggle("active", selected);

        if (selected) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });

      // Return to the top without scrolling to the selected section.
      window.scrollTo(0, 0);
    }

    // Header button clicks.
    navButtons.forEach(button => {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });
    });

    // Optional brand click returns to the first section.
    document.getElementById("brandHome").addEventListener("click", event => {
      event.preventDefault();
      showPage("section1");
    });
  </script>

</body>
</html>
