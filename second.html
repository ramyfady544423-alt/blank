    <title>18 Column Grid</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --cell-bg: #f8fafc;
            --cell-border: #cbd5e1;
            --cell-text: #1e293b;
            --cell-radius: 10px;
            --cell-min-height: 105px;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #eef2f7;
            font-family: system-ui, sans-serif;
        }

        .page-title {
            text-align: center;
            margin-bottom: 24px;
            font-weight: 700;
        }

        /* Horizontal scrolling keeps all 18 columns intact */
        .grid-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 12px;
        }

        .periodic-grid {
            display: grid;
            grid-template-columns: repeat(18, minmax(85px, 1fr));
            grid-template-rows: repeat(11, var(--cell-min-height));
            gap: 6px;
            min-width: 1650px;
        }

        /* Each occupied cell */
        .element {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-width: 0;
            padding: 8px 5px;
            border: 1px solid var(--cell-border);
            border-radius: var(--cell-radius);
            background: var(--cell-bg);
            color: var(--cell-text);
            text-align: center;
            overflow: hidden;
            transition:
                transform 180ms ease,
                box-shadow 180ms ease,
                border-color 180ms ease;
        }

        .element:hover {
            transform: translateY(-3px);
            border-color: #64748b;
            box-shadow: 0 5px 14px rgb(15 23 42 / 12%);
            z-index: 2;
        }

        /* Small ID at the top */
        .element-id {
            align-self: flex-start;
            font-size: 10px;
            line-height: 1.2;
            color: #64748b;
            font-weight: 600;
            margin-bottom: 5px;
        }

        /* Avatar/image placeholder */
        .avatar {
            width: 35px;
            height: 35px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #dbeafe;
            border: 1px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Your own text goes here */
        .element-text {
            width: 100%;
            min-height: 20px;
            font-size: 12px;
            font-weight: 600;
            overflow-wrap: anywhere;
            outline: none;
        }

        .element-text:empty::before {
            content: "Your text";
            color: #94a3b8;
            font-weight: 400;
        }

        /* Empty rows remain completely empty */
        .empty-row {
            grid-column: 1 / -1;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .page-title {
                font-size: 20px;
            }
        }
    </style>
</head>

        /*
          Define occupied columns for each row.
          Columns are numbered 1 through 18, from left to right.
        */
        const rowColumns = {
            1:  [1, 18],
            2:  [1, 2, 13, 14, 15, 16, 17, 18],
            3:  [1, 2, 13, 14, 15, 16, 17, 18],
            4:  Array.from({ length: 18 }, (_, i) => i + 1),
            5:  Array.from({ length: 18 }, (_, i) => i + 1),

            // Column 3 is empty in rows 6 and 7
            6:  [...[1, 2], ...Array.from(
                { length: 15 }, (_, i) => i + 4
            )],
            7:  [...[1, 2], ...Array.from(
                { length: 15 }, (_, i) => i + 4
            )],

            // Entirely empty rows
            8:  [],
            9:  [],

            // Rows 10 and 11 occupy columns 4 through 18
            10: Array.from({ length: 15 }, (_, i) => i + 4),
            11: Array.from({ length: 15 }, (_, i) => i + 4)
        };

        /*
          Numbering order:
          Rows 1–5, first 2 cells of row 6, row 10,
          remaining cells of row 6, first 2 cells of row 7,
          row 11, remaining cells of row 7.
        */
        const numberingOrder = [
            ...[1, 2, 3, 4, 5].flatMap(row =>
                rowColumns[row].map(col => [row, col])
            ),

            [6, 1], [6, 2],

            ...rowColumns[10].map(col => [10, col]),

            ...rowColumns[6]
                .filter(col => col !== 1 && col !== 2)
                .map(col => [6, col]),

            [7, 1], [7, 2],

            ...rowColumns[11].map(col => [11, col]),

            ...rowColumns[7]
                .filter(col => col !== 1 && col !== 2)
                .map(col => [7, col])
        ];

        // Assign the correct ID to each occupied position
        const idMap = new Map();

        numberingOrder.forEach(([row, col], index) => {
            idMap.set(`${row}-${col}`, index + 1);
        });

        // Create the grid cells
        for (let row = 1; row <= 11; row++) {

            // Keep empty rows 8 and 9 at their correct heights
            if (rowColumns[row].length === 0) {
                const spacer = document.createElement("div");
                spacer.className = "empty-row";
                spacer.style.gridRow = row;
                grid.appendChild(spacer);
                continue;
            }

            for (const col of rowColumns[row]) {
                const id = idMap.get(`${row}-${col}`);

                const cell = document.createElement("div");
                cell.className = "element";
                cell.style.gridRow = row;
                cell.style.gridColumn = col;
               
cell.addEventListener("click", () => {
    const explanation = document.querySelector(".explanation");

    // Get the element's name and its detailed information
    const elementName = elements[id][0];

    explanation.innerHTML = `

        <strong>Atomic Number:</strong> ${details.atomic_number}<br>
        <strong>Atomic Mass:</strong> ${details.atomic_mass}<br>
        <strong>Group:</strong> ${details.group ?? "Not assigned"}<br>
        <strong>Period:</strong> ${details.period}<br>
        <strong>Category:</strong> ${details.category}<br>

    `;
});
