<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Menu</title>

    <!-- Bootstrap 5.3 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background-color: #071426;
            animation: backgroundGlow 8s ease-in-out infinite alternate;
            font-family: Arial, sans-serif;
        }

        @keyframes backgroundGlow {
            from {
                background-color: #071426;
            }

            to {
                background-color: #102b49;
            }
        }

        .menu-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 30px;
        }

        .menu-title {
            color: white;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
        }

        .menu-button {
            width: min(100%, 500px);
            min-height: 100px;
            font-size: 1.6rem;
            font-weight: 700;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            transition:
                transform 0.3s ease,
                background-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .menu-button:hover {
            color: white;
            background: rgba(65, 145, 255, 0.25);
            transform: scale(1.04);
            box-shadow: 0 12px 35px rgba(0, 100, 255, 0.2);
        }

        .menu-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <main class="menu-container">

        <h1 class="menu-title">Main Menu</h1>

        <a href="page1.html"
           class="btn menu-button d-flex justify-content-center align-items-center">
            Page One
        </a>

        <a href="page2.html"
           class="btn menu-button d-flex justify-content-center align-items-center">
            Page Two
        </a>

        <a href="page3.html"
           class="btn menu-button d-flex justify-content-center align-items-center">
            Page Three
        </a>

    </main>

</body>
</html>
