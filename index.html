
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>HTML File Toggle</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .app-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 24px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .main-buttons,
        .sub-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .main-buttons .btn,
        .sub-buttons .btn {
            flex: 1;
            min-width: 100px;
        }

        .viewer {
            width: 100%;
            height: 600px;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            background: white;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

<div class="container-fluid app-container">

    <h2 class="mb-4">HTML File Viewer</h2>

    <!-- 3 MAIN TOGGLE BUTTONS -->
    <div class="section-title">Main sections</div>

    <div class="main-buttons mb-4" id="mainButtons">
        <button class="btn btn-primary active" data-section="1">
            Section 1
        </button>

        <button class="btn btn-outline-primary" data-section="2">
            Section 2
        </button>

        <button class="btn btn-outline-primary" data-section="3">
            Section 3
        </button>
    </div>

    <hr>

    <!-- 4 SUB-TOGGLE BUTTONS -->
    <div class="section-title">Pages</div>

    <div class="sub-buttons mb-4" id="subButtons">
        <button class="btn btn-success active" data-page="1">
            Page 1
        </button>

        <button class="btn btn-outline-success" data-page="2">
            Page 2
        </button>

        <button class="btn btn-outline-success" data-page="3">
            Page 3
        </button>

        <button class="btn btn-outline-success" data-page="4">
            Page 4
        </button>
    </div>

    <!-- HTML FILE DISPLAY -->
    <iframe
        id="htmlViewer"
        class="viewer"
        src="https://my-app-project-whknyzp75yacjeatrj8day.streamlit.app/?embed=True&group=0&property=0"
        title="HTML file viewer"
    ></iframe>

</div>

<script>
    const mainButtons = document.querySelectorAll(
        "#mainButtons button"
    );

    const subButtons = document.querySelectorAll(
        "#subButtons button"
    );

    const htmlViewer = document.getElementById("htmlViewer");

    let currentSection = 1;
    let currentPage = 1;

    function loadHTML() {
        // Example: section2/page3.html
        htmlViewer.src =
            `https://my-app-project-whknyzp75yacjeatrj8day.streamlit.app/?embed=True&group=${currentSection-1}&property=${currentPage-1}`;
    }

    // Toggle between the 3 main sections
    mainButtons.forEach(button => {
        button.addEventListener("click", () => {
            currentSection = Number(button.dataset.section);

            mainButtons.forEach(btn => {
                const selected = btn === button;
                btn.classList.toggle("active", selected);
                btn.classList.toggle("btn-primary", selected);
                btn.classList.toggle("btn-outline-primary", !selected);
            });

            loadHTML();
        });
    });

    // Toggle between the 4 pages
    subButtons.forEach(button => {
        button.addEventListener("click", () => {
            currentPage = Number(button.dataset.page);

            subButtons.forEach(btn => {
                const selected = btn === button;
                btn.classList.toggle("active", selected);
                btn.classList.toggle("btn-success", selected);
                btn.classList.toggle("btn-outline-success", !selected);
            });

            loadHTML();
        });
    });
</script>

</body>
</html>
