
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Main Menu</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #071426;
            background-image:
                radial-gradient(ellipse at 10% 0%, #0b2850 0%, transparent 40%),
                radial-gradient(ellipse at 90% 100%, #071f3c 0%, transparent 45%);
        }

        /* Decorative background lights */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            pointer-events: none;
            z-index: -1;
            animation: floatLight 12s ease-in-out infinite alternate;
        }

        body::before {
            background: #087cff;
            top: -250px;
            left: -150px;
        }

        body::after {
            background: #5725ff;
            bottom: -280px;
            right: -150px;
            animation-delay: -6s;
        }

        @keyframes floatLight {
            from {
                transform: translate(0, 0);
            }
            to {
                transform: translate(100px, 80px);
            }
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        /* Heading */
        .top-decoration {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            color: #39aaff;
        }

        .top-decoration span {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #279bff);
        }

        .top-decoration span:last-child {
            transform: rotate(180deg);
        }

        .top-decoration i {
            font-size: 25px;
            filter: drop-shadow(0 0 12px #008cff);
        }

        .main-title {
            font-size: clamp(3rem, 7vw, 5.5rem);
            font-weight: 800;
            letter-spacing: -3px;
            text-align: center;
            margin: 0;
            background: linear-gradient(
                110deg,
                #ffffff 20%,
                #8bd9ff 55%,
                #188aff 85%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #8ca8cc;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-align: center;
            margin-top: 12px;
            margin-bottom: 48px;
        }

        /* Button list */
        .menu-list {
            width: min(100%, 680px);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .menu-button {
            --accent: #168cff;
            --accent-rgb: 22, 140, 255;

            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            gap: 28px;
            width: 100%;
            min-height: 150px;
            padding: 26px 32px;
            overflow: hidden;

            text-decoration: none;
            color: white;

            border: 1px solid rgba(var(--accent-rgb), 0.75);
            border-radius: 32px;

            background:
                linear-gradient(
                    115deg,
                    rgba(var(--accent-rgb), 0.15),
                    rgba(7, 20, 38, 0.92) 65%
                );

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.08),
                0 10px 35px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.35s cubic-bezier(.2, .8, .2, 1),
                border-color 0.35s ease,
                box-shadow 0.35s ease,
                background 0.35s ease;
        }

        /* Moving shine on hover */
        .menu-button::before {
            content: "";
            position: absolute;
            z-index: -1;
            top: 0;
            left: -130%;
            width: 80%;
            height: 100%;
            transform: skewX(-20deg);
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.09),
                transparent
            );
            transition: left 0.7s ease;
        }

        /* Glow underneath each button */
        .menu-button::after {
            content: "";
            position: absolute;
            z-index: -2;
            inset: 15px;
            border-radius: inherit;
            background: rgba(var(--accent-rgb), 0.25);
            filter: blur(30px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        /* Main hover effect */
        .menu-button:hover {
            color: white;
            transform: translateY(-7px) scale(1.015);
            border-color: var(--accent);
            background:
                linear-gradient(
                    115deg,
                    rgba(var(--accent-rgb), 0.27),
                    rgba(8, 25, 48, 0.96) 70%
                );
            box-shadow:
                0 0 0 1px rgba(var(--accent-rgb), 0.12),
                0 0 28px rgba(var(--accent-rgb), 0.24),
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .menu-button:hover::before {
            left: 150%;
        }

        .menu-button:hover::after {
            opacity: 1;
        }

        .menu-button:active {
            transform: translateY(-2px) scale(0.99);
        }

        .menu-button:focus-visible {
            outline: 3px solid white;
            outline-offset: 5px;
        }

        /* Icon square */
        .icon-box {
            flex-shrink: 0;
            width: 84px;
            height: 84px;
            display: grid;
            place-items: center;
            border-radius: 23px;
            color: var(--accent);
            font-size: 2.5rem;

            border: 1px solid rgba(var(--accent-rgb), 0.5);
            background: rgba(var(--accent-rgb), 0.13);

            box-shadow: inset 0 0 25px rgba(var(--accent-rgb), 0.08);

            transition:
                transform 0.35s ease,
                background 0.35s ease,
                box-shadow 0.35s ease;
        }

        .menu-button:hover .icon-box {
            transform: rotate(-5deg) scale(1.08);
            background: rgba(var(--accent-rgb), 0.22);
            box-shadow: 0 0 25px rgba(var(--accent-rgb), 0.18);
        }

        .button-content {
            flex: 1;
            min-width: 0;
        }

        .button-title {
            display: block;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .button-description {
            display: block;
            color: #8ba7cd;
            font-size: 0.78rem;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        .arrow-circle {
            flex-shrink: 0;
            width: 60px;
            height: 60px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            border: 1px solid rgba(var(--accent-rgb), 0.4);
            background: rgba(var(--accent-rgb), 0.08);
            font-size: 1.7rem;
            transition:
                transform 0.35s ease,
                background 0.35s ease;
        }

        .menu-button:hover .arrow-circle {
            transform: translateX(6px);
            background: rgba(var(--accent-rgb), 0.22);
        }

        /* Individual button colors */
        .blue {
            --accent: #36aaff;
            --accent-rgb: 54, 170, 255;
        }

        .purple {
            --accent: #9271ff;
            --accent-rgb: 146, 113, 255;
        }

        .cyan {
            --accent: #20e5ec;
            --accent-rgb: 32, 229, 236;
        }

        .footer {
            margin-top: 45px;
            color: #526a8b;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Mobile adjustments */
        @media (max-width: 576px) {
            .main-container {
                padding: 45px 18px;
            }

            .subtitle {
                letter-spacing: 3px;
                font-size: 0.75rem;
                margin-bottom: 35px;
            }

            .menu-list {
                gap: 18px;
            }

            .menu-button {
                min-height: 115px;
                padding: 20px 17px;
                gap: 15px;
                border-radius: 24px;
            }

            .icon-box {
                width: 57px;
                height: 57px;
                font-size: 1.8rem;
                border-radius: 17px;
            }

            .button-description {
                font-size: 0.62rem;
                letter-spacing: 1px;
            }

            .arrow-circle {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="main-container">

        <div class="top-decoration" aria-hidden="true">
            <span></span>
            <i class="bi bi-stars"></i>
            <span></span>
        </div>

        <h1 class="main-title">Welcome</h1>

        <p class="subtitle">CHOOSE AN OPTION</p>

        <nav class="menu-list" aria-label="Main navigation">

            <a href="page1.html" class="menu-button blue">
                <span class="icon-box">
                    <i class="bi bi-person" aria-hidden="true"></i>
                </span>

                <span class="button-content">
                    <span class="button-title">Page One</span>
                    <span class="button-description">
                        EXPLORE · DISCOVER · LEARN
                    </span>
                </span>

                <span class="arrow-circle">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </span>
            </a>

            <a href="page2.html" class="menu-button purple">
                <span class="icon-box">
                    <i class="bi bi-gear" aria-hidden="true"></i>
                </span>

                <span class="button-content">
                    <span class="button-title">Page Two</span>
                    <span class="button-description">
                        BUILD · CREATE · IMPROVE
                    </span>
                </span>

                <span class="arrow-circle">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </span>
            </a>

            <a href="page3.html" class="menu-button cyan">
                <span class="icon-box">
                    <i class="bi bi-graph-up-arrow" aria-hidden="true"></i>
                </span>

                <span class="button-content">
                    <span class="button-title">Page Three</span>
                    <span class="button-description">
                        ANALYZE · GROW · SUCCEED
                    </span>
                </span>

                <span class="arrow-circle">
                    <i class="bi bi-arrow-right" aria-hidden="true"></i>
                </span>
            </a>

        </nav>

        <footer class="footer">
            SELECT YOUR DESTINATION
        </footer>

    </main>

</body>
</html>
