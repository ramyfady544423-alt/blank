
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/header/header.css">
</head>

<body>

  <!-- Header: customize the buttons as needed -->

  <header class="glass-header">

    <a href="#" class="brand" id="brandHome">
      Science Hub<span>.</span>
    </a>

    <nav class="nav nav-glass" id="mainNav" aria-label="Main navigation">

      <button
        class="nav-link active"
        type="button"
        data-page="section1"
        aria-current="page">
        Viscosity
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section2">
        Denisty
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section3">
       Physical states
      </button>

      <button
        class="nav-link"
        type="button"
        data-page="section4">
        Bouncing ball
      </button>

    </nav>
  </header>

  <!--
    YOUR SECTIONS GO HERE.

    Give each section the class "page-section".
    The first section should also have the class "active".
    Each section's ID must match a navigation button's data-page.
  -->

  <main id="pageContainer">

    <section id="section1" class="page-section active">
      <iframe src="fifth.html"></iframe>
    </section>

    <section id="section2" class="page-section">
      <iframe src="sixth.html"></iframe>
    </section>

    <section id="section3" class="page-section">
      <iframe src="seventh.html"></iframe>
    </section>

    <section id="section4" class="page-section">
      <iframe src="eight.html"></iframe>
    </section>

  </main>

  <script>
    /* Single-page navigation */

    const navButtons = document.querySelectorAll(
      "#mainNav [data-page]"
    );

    const pages = document.querySelectorAll(
      "#pageContainer .page-section"
    );

    let currentPage = "section1";

    function showPage(pageId) {
      const targetPage = document.getElementById(pageId);

      // Only allow navigation to registered pages.
      if (!targetPage || !targetPage.classList.contains("page-section")) {
        return;
      }

      if (currentPage === pageId) {
        return;
      }

      currentPage = pageId;

      // Hide all sections.
      pages.forEach(page => {
        page.classList.remove("active");
      });

      // Reveal only the selected section.
      targetPage.classList.add("active");

      // Update the selected header button.
      navButtons.forEach(button => {
        const selected = button.dataset.page === pageId;

        button.classList.toggle("active", selected);

        if (selected) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }
      });

      // Return to the top without scrolling to the selected section.
      window.scrollTo(0, 0);
    }

    // Header button clicks.
    navButtons.forEach(button => {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });
    });

    // Optional brand click returns to the first section.
    document.getElementById("brandHome").addEventListener("click", event => {
      event.preventDefault();
      showPage("section1");
    });
  </script>

</body>
</html>
