
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Center</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
        background: #071426;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        padding: 20px;
    }

    .main-card {
        background: #10243d;
        border: 1px solid #203d5e;
        border-radius: 24px;
        padding: 35px;
        width: 100%;
        max-width: 520px;
        text-align: center;
        box-shadow: 0 15px 50px #0005;
    }

    .icon {
        font-size: 55px;
        margin-bottom: 15px;
    }

    h2 {
        font-weight: bold;
    }

    .description {
        color: #9eb2ca;
        margin: 15px 0 25px;
    }

    .main-btn {
        width: 100%;
        padding: 15px;
        border-radius: 12px;
        font-size: 17px;
        font-weight: bold;
        margin-top: 12px;
        transition: 0.25s;
    }

    .main-btn:hover, .sub-btn:hover {
        transform: translateY(-3px);
    }

    .download-btn {
        background: #1677ff;
        color: white;
        border: none;
    }

    .download-btn:hover {
        background: #005de0;
        color: white;
    }

    .qr-btn {
        background: transparent;
        border: 2px solid #328cff;
        color: #64aaff;
    }

    .qr-btn:hover {
        background: #1677ff;
        color: white;
    }

    .menu {
        display: none;
        margin-top: 20px;
        animation: appear .3s ease;
    }

    .category-btn {
        background: #1b3655;
        color: white;
        border: 1px solid #365779;
        padding: 16px;
        border-radius: 12px;
        width: 100%;
        margin-top: 10px;
        font-weight: bold;
        transition: .2s;
    }

    .category-btn:hover {
        background: #28517d;
        color: white;
        transform: translateY(-2px);
    }

    .sub-menu {
        display: none;
        padding: 10px 12px;
        background: #0b1c30;
        border-radius: 14px;
        margin-top: 10px;
        animation: appear .3s ease;
    }

    .sub-btn {
        width: 100%;
        background: #1677ff;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 9px;
        margin: 5px 0;
        font-weight: bold;
        transition: .2s;
    }

    .sub-btn:hover {
        background: #005de0;
        color: white;
    }

    .qr-container {
        display: none;
        background: white;
        padding: 20px;
        border-radius: 15px;
        margin-top: 20px;
    }

    .qr-container img {
        width: 220px;
        max-width: 100%;
    }

    .qr-container p {
        color: #26364a;
        margin: 12px 0 0;
        font-weight: bold;
    }

    .footer {
        color: #7189a5;
        font-size: 12px;
        margin-top: 25px;
    }

    @keyframes appear {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>
</head>

<body>

<div class="main-card">

    <div class="icon">📁</div>

    <h2>Download Center</h2>

    <p class="description">
        Choose your preferred version and download your file.
    </p>

    <!-- MAIN DOWNLOAD BUTTON -->
    <button class="btn main-btn download-btn"
            onclick="toggleMenu()">
        ⬇ Download File
    </button>

    <!-- FIRST TWO OPTIONS -->
    <div class="menu" id="mainMenu">

        <button class="category-btn"
                onclick="toggleSubMenu('menu1')">
            📚 Quizzes
        </button>

        <div class="sub-menu" id="menu1">

            <button class="sub-btn" onclick="downloadFile('file1')">
                📱 Android APK
            </button>

            <button class="sub-btn" onclick="downloadFile('file2')">
                💻 Windows EXE
            </button>

            <button class="sub-btn" onclick="downloadFile('file3')">
                🐧 Linux TAR.GZ
            </button>

        </div>

        <button class="category-btn"
                onclick="toggleSubMenu('menu2')">
            ⏰ Alarms
        </button>

        <div class="sub-menu" id="menu2">

            <button class="sub-btn" onclick="downloadFile('file4')">
                📱 Android APK
            </button>

            <button class="sub-btn" onclick="downloadFile('file5')">
                💻 Windows EXE
            </button>

            <button class="sub-btn" onclick="downloadFile('file6')">
                🐧 Linux TAR.GZ
            </button>

        </div>

    </div>

    <!-- QR CODE BUTTON -->
    <button class="btn main-btn qr-btn"
            onclick="toggleQR()">
        ▦ Show QR Code
    </button>

    <!-- QR CODE -->
    <div class="qr-container" id="qrContainer">
        <img src="bing_generated_qrcode.png" alt="QR Code">
        <p>Scan to access the download page</p>
    </div>

    <div class="footer">
        Secure File Access
    </div>

</div>

<script>

// DOWNLOAD LINKS

const downloadLinks = {

    file1: "https://github.com/ramyfady544423-alt/bla/releases/latest/download/app-release.apk",
    file2: "https://github.com/ramyfady544423-alt/bla/releases/latest/download/windows-release.zip",
    file3: "https://github.com/ramyfady544423-alt/bla/releases/latest/download/linux-release.tar.gz",

    file4: "https://github.com/ramyfady544423-alt/blan/releases/latest/download/app-release.apk",
    file5: "https://github.com/ramyfady544423-alt/blan/releases/latest/download/windows-release.zip",
    file6: "https://github.com/ramyfady544423-alt/blan/releases/latest/download/linux-release.tar.gz"

};


// SHOW FIRST TWO OPTIONS

function toggleMenu() {

    const menu = document.getElementById("mainMenu");

    const isOpen = menu.style.display === "block";

    menu.style.display = isOpen ? "none" : "block";

    // Reset both submenus
    if (isOpen) {
        closeAllSubMenus();
    }
}


// CLOSE ALL THREE-BUTTON MENUS

function closeAllSubMenus() {

    document.querySelectorAll(".sub-menu").forEach(el => {
        el.style.display = "none";
    });

}


// SHOW THREE DOWNLOAD OPTIONS AFTER CATEGORY SELECTION

function toggleSubMenu(id) {

    const selected = document.getElementById(id);

    const wasOpen = selected.style.display === "block";

    // Close all other menus first
    closeAllSubMenus();

    // Open the selected menu
    if (!wasOpen) {
        selected.style.display = "block";
    }

}


// DOWNLOAD FILE

function downloadFile(file) {

    const link = downloadLinks[file];

    if (!link) {
        alert("Download link not found!");
        return;
    }

    // Open direct download link
    window.location.href = link;

}


// QR CODE

function toggleQR() {

    const qr = document.getElementById("qrContainer");

    qr.style.display =
        qr.style.display === "block" ? "none" : "block";

}

</script>

</body>
</html>
